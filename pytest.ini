# pytest.ini

[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for selective test execution
markers =
    deferred: Deferred Projection Runtime
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires database)
    chaos: Chaos engineering tests
    requires_chaos_environment: Requires external chaos infrastructure (Kafka, PostgreSQL, etc.)
    performance: Performance/Load tests
    event_store: Event Store tests
    projection: Projection tests
    security: Security tests
    telemetry: Telemetry tests
    core: Core domain tests
    legacy: Tests that need to be migrated
    e2e: End-to-end tests
    chaos: Chaos engineering tests
    golden: Golden snapshot tests
    regression: Regression tests
    slow: Long running tests

# Collection configuration
addopts =
    -ra
    --tb=short
    --strict-markers
    --strict-config

# Ignore performance tests during default collection
norecursedirs =
    .git
    .tox
    .venv
    venv
    __pycache__
    node_modules
    .pytest_cache
    tests/performance
    tests/legacy

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# Filter warnings
filterwarnings =
    ignore::pytest.PytestCollectionWarning

# Coverage configuration
[coverage:run]
source = backend
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.:
    raise NotImplementedError
    if TYPE_CHECKING: