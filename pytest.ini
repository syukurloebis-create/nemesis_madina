# pytest.ini

[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for selective test execution
markers =
    # Existing markers
    deferred: Deferred Projection Runtime
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires database)
    chaos: Chaos engineering tests
    requires_chaos_environment: Requires external chaos infrastructure (Kafka, PostgreSQL, etc.)
    performance: Performance/Load tests
    event_store: Event Store tests
    projection: Projection tests
    security: Security tests
    telemetry: Telemetry tests
    core: Core domain tests
    legacy: Tests that need to be migrated
    e2e: End-to-end tests
    golden: Golden snapshot tests
    regression: Regression tests
    slow: Long running tests
    
    # Metadata Inventory markers
    metadata_inventory: Metadata Inventory tests
    discovery: Registry/Model Discovery tests
    verification: ORM Verification Engine tests
    rule: Verification Rule tests
    artifact: Artifact tests
    serializer: Canonical Serializer tests
    fingerprint: Fingerprint tests
    ledger: Append Ledger tests
    dag: DAG execution tests
    smoke: Smoke tests (quick sanity checks)

# Collection configuration
addopts =
    -ra
    --tb=short
    --strict-markers
    --strict-config

# Ignore performance tests during default collection
norecursedirs =
    .git
    .tox
    .venv
    venv
    __pycache__
    node_modules
    .pytest_cache
    tests/performance
    tests/legacy
    scripts/metadata_inventory/__pycache__

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# Filter warnings
filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning:sqlalchemy
    ignore::DeprecationWarning:pydantic

# Coverage configuration
[coverage:run]
source =
    backend
    scripts/metadata_inventory
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*
    */scripts/metadata_inventory/evidence/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.:
    raise NotImplementedError
    if TYPE_CHECKING:
    pass