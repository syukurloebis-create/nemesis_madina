<!DOCTYPE html>
<html>
<head>
    <title>NEMESIS Live Alert Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff9d;
            border-bottom: 2px solid #00ff9d;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #00ff9d;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00ff9d;
        }
        .stat-label {
            color: #888;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .alerts-panel {
            background: #0f0f1a;
            border-radius: 12px;
            padding: 20px;
        }
        .alerts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a3e;
        }
        .alert-card {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            border-left: 4px solid;
        }
        .alert-card:hover {
            transform: translateX(5px);
            background: #22223b;
        }
        .alert-critical { border-left-color: #ff4757; }
        .alert-high { border-left-color: #ff6b6b; }
        .alert-medium { border-left-color: #ffa502; }
        .alert-low { border-left-color: #1e90ff; }
        .alert-info { border-left-color: #2ed573; }
        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .alert-title {
            font-weight: bold;
            font-size: 1.1em;
        }
        .alert-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
        }
        .severity-critical { background: #ff4757; color: white; }
        .severity-high { background: #ff6b6b; color: white; }
        .severity-medium { background: #ffa502; color: #1a1a2e; }
        .severity-low { background: #1e90ff; color: white; }
        .severity-info { background: #2ed573; color: #1a1a2e; }
        .status-new { background: #ff4757; color: white; }
        .status-acknowledged { background: #ffa502; color: #1a1a2e; }
        .status-investigating { background: #1e90ff; color: white; }
        .status-resolved { background: #2ed573; color: #1a1a2e; }
        .alert-description {
            color: #bbb;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        .alert-meta {
            font-size: 0.75em;
            color: #666;
            margin-bottom: 12px;
        }
        .alert-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: transparent;
            border: 1px solid #00ff9d;
            color: #00ff9d;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #00ff9d;
            color: #0a0a1a;
        }
        .btn-danger {
            border-color: #ff4757;
            color: #ff4757;
        }
        .btn-danger:hover {
            background: #ff4757;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        .connection-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .connected { background: #2ed573; box-shadow: 0 0 5px #2ed573; }
        .disconnected { background: #ff4757; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .alert-new {
            animation: pulse 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 NEMESIS Live Alert Center</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalAlerts">0</div>
                <div class="stat-label">Total Alerts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="criticalAlerts">0</div>
                <div class="stat-label">Critical Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="unresolvedAlerts">0</div>
                <div class="stat-label">Unresolved</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="responseTime">--</div>
                <div class="stat-label">Avg Response Time</div>
            </div>
        </div>
        
        <div class="alerts-panel">
            <div class="alerts-header">
                <h3>📡 Live Alert Stream</h3>
                <div>
                    <span class="connection-status" id="connStatus"></span>
                    <span id="connText">Connecting...</span>
                </div>
            </div>
            <div id="alertsList">
                <div class="empty-state">Loading alerts...</div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let alerts = [];
        let currentUser = "admin";
        
        function connectWebSocket() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//localhost:8000/alerts/ws`);
            
            ws.onopen = function() {
                console.log("WebSocket connected");
                document.getElementById("connStatus").className = "connection-status connected";
                document.getElementById("connText").innerText = "Connected";
            };
            
            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };
            
            ws.onclose = function() {
                console.log("WebSocket disconnected");
                document.getElementById("connStatus").className = "connection-status disconnected";
                document.getElementById("connText").innerText = "Disconnected - Reconnecting...";
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = function(error) {
                console.error("WebSocket error:", error);
            };
        }
        
        function handleMessage(message) {
            if (message.type === "initial_alerts") {
                alerts = message.data;
                renderAlerts();
            } else if (message.type === "new_alert") {
                alerts.unshift(message.data);
                renderAlerts();
                playNotificationSound();
            } else if (message.type === "alert_update") {
                const alert = alerts.find(a => a.id === message.data.alert_id);
                if (alert) {
                    alert.status = message.data.status;
                    renderAlerts();
                }
            }
        }
        
        async function acknowledgeAlert(alertId) {
            try {
                const response = await fetch(`/alerts/${alertId}/acknowledge`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ alert_id: alertId, user: currentUser })
                });
                if (response.ok) {
                    const alert = alerts.find(a => a.id === alertId);
                    if (alert) alert.status = "acknowledged";
                    renderAlerts();
                }
            } catch (error) {
                console.error("Failed to acknowledge:", error);
            }
        }
        
        async function investigateAlert(alertId) {
            try {
                const response = await fetch(`/alerts/${alertId}/investigate?user=${currentUser}`, {
                    method: "POST"
                });
                if (response.ok) {
                    const alert = alerts.find(a => a.id === alertId);
                    if (alert) alert.status = "investigating";
                    renderAlerts();
                }
            } catch (error) {
                console.error("Failed to investigate:", error);
            }
        }
        
        async function resolveAlert(alertId) {
            const note = prompt("Enter resolution note:");
            if (note) {
                try {
                    const response = await fetch(`/alerts/${alertId}/resolve`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ alert_id: alertId, user: currentUser, note: note })
                    });
                    if (response.ok) {
                        const alert = alerts.find(a => a.id === alertId);
                        if (alert) alert.status = "resolved";
                        renderAlerts();
                    }
                } catch (error) {
                    console.error("Failed to resolve:", error);
                }
            }
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }
        
        function renderAlerts() {
            const container = document.getElementById("alertsList");
            const total = alerts.length;
            const critical = alerts.filter(a => a.severity === "critical" && a.status !== "resolved").length;
            const unresolved = alerts.filter(a => a.status !== "resolved").length;
            
            document.getElementById("totalAlerts").innerText = total;
            document.getElementById("criticalAlerts").innerText = critical;
            document.getElementById("unresolvedAlerts").innerText = unresolved;
            
            if (alerts.length === 0) {
                container.innerHTML = '<div class="empty-state">✨ No alerts at this time</div>';
                return;
            }
            
            container.innerHTML = alerts.map(alert => `
                <div class="alert-card alert-${alert.severity} ${alert.status === 'new' ? 'alert-new' : ''}">
                    <div class="alert-header">
                        <span class="alert-title">⚠️ ${escapeHtml(alert.title)}</span>
                        <div class="alert-badges">
                            <span class="badge severity-${alert.severity}">${alert.severity.toUpperCase()}</span>
                            <span class="badge status-${alert.status}">${alert.status}</span>
                        </div>
                    </div>
                    <div class="alert-description">${escapeHtml(alert.description)}</div>
                    <div class="alert-meta">
                        ${alert.entity_name ? `🏢 ${escapeHtml(alert.entity_name)} | ` : ""}
                        ${alert.case_id ? `📋 Case: ${escapeHtml(alert.case_id)} | ` : ""}
                        🕐 ${formatDate(alert.timestamp)}
                    </div>
                    <div class="alert-actions">
                        ${alert.status === "new" ? `<button class="btn" onclick="acknowledgeAlert('${alert.id}')">✓ Acknowledge</button>` : ""}
                        ${alert.status === "acknowledged" ? `<button class="btn" onclick="investigateAlert('${alert.id}')">🔍 Investigate</button>` : ""}
                        ${alert.status !== "resolved" && alert.status !== "new" ? `<button class="btn btn-danger" onclick="resolveAlert('${alert.id}')">✅ Resolve</button>` : ""}
                    </div>
                </div>
            `).join("");
        }
        
        function playNotificationSound() {
            // Optional sound notification
            try {
                const audio = new Audio('data:audio/wav;base64,U3RlYWx0aCBiZWVw');
                audio.play().catch(() => {});
            } catch(e) {}
        }
        
        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Refresh stats periodically
        async function refreshStats() {
            try {
                const response = await fetch("/alerts/summary/stats");
                const data = await response.json();
                document.getElementById("totalAlerts").innerText = data.total || 0;
                document.getElementById("criticalAlerts").innerText = data.unresolved_critical || 0;
                document.getElementById("unresolvedAlerts").innerText = (data.by_status?.new || 0) + (data.by_status?.acknowledged || 0) + (data.by_status?.investigating || 0);
            } catch (error) {
                console.error("Failed to fetch stats:", error);
            }
        }
        
        // Initialize
        connectWebSocket();
        refreshStats();
        setInterval(refreshStats, 10000);
    </script>
</body>
</html>
