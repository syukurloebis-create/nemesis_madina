services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: nemesis
      POSTGRES_PASSWORD: nemesis123
      POSTGRES_DB: nemesis_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemesis"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nemesis:nemesis123@postgres:5432/nemesis_db
      SECRET_KEY: nemesis-super-secret-key

  api1:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nemesis:nemesis123@postgres:5432/nemesis_db
      SECRET_KEY: nemesis-super-secret-key
    ports:
      - "8001:8000"

  api2:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nemesis:nemesis123@postgres:5432/nemesis_db
      SECRET_KEY: nemesis-super-secret-key
    ports:
      - "8002:8000"

  api3:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nemesis:nemesis123@postgres:5432/nemesis_db
      SECRET_KEY: nemesis-super-secret-key
    ports:
      - "8003:8000"

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
