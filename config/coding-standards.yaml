# config/coding-standards.yaml
version: 1.0

python:
  version: "3.11"
  formatter: "black"
  linter: "ruff"
  type_checker: "mypy"
  import_sorter: "isort"
  docstring_style: "google"
  
naming:
  classes: "PascalCase"
  functions: "snake_case"
  variables: "snake_case"
  constants: "UPPER_SNAKE_CASE"
  interfaces: "I + PascalCase"
  abstract_classes: "Abstract + PascalCase"
  
logging:
  format: "json"
  levels: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
  context_fields: ["timestamp", "level", "module", "function", "line"]
  
error_handling:
  use_exceptions: true
  custom_exceptions: true
  error_codes: true