apiVersion: v1
kind: Secret
metadata:
  name: nemesis-secrets
  namespace: nemesis
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://nemesis:${DB_PASSWORD}@postgres:5432/nemesis_db"
  SECRET_KEY: "${SECRET_KEY}"
  POSTGRES_PASSWORD: "${DB_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"