apiVersion: v1
kind: ConfigMap
metadata:
  name: nemesis-config
  namespace: nemesis
data:
  ENVIRONMENT: "production"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "nemesis_db"
  REDIS_URL: "redis://redis:6379/0"
  NATS_URL: "nats://nats:4222"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"