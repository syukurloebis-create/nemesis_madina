apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nemesis-ingress
  namespace: nemesis
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: nemesis.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nemesis-api
            port:
              number: 8000