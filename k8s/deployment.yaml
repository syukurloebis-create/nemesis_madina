apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemesis-api
  namespace: nemesis
  labels:
    app: nemesis
    version: v8.1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nemesis
  template:
    metadata:
      labels:
        app: nemesis
    spec:
      containers:
      - name: api
        image: nemesis/backend:8.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "sqlite:///./nemesis.db"
        - name: ENVIRONMENT
          value: "production"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
