# PostgreSQL Streaming Replication
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: nemesis
spec:
  serviceName: postgres-replica
  replicas: 2
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "nemesis"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nemesis-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "nemesis_db"
        - name: PRIMARY_HOST
          value: "postgres"
        volumeMounts:
        - name: postgres-replica-data
          mountPath: /var/lib/postgresql/data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: nemesis
spec:
  selector:
    app: postgres-replica
  ports:
  - port: 5432
    targetPort: 5432